<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Itz Fizz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="hero">

        <div class="hero-background"></div>

        <div class="hero-content">

            <p class="eyebrow">
                INTRODUCING THE EXPERIENCE
            </p>

            <h1 class="hero-title">
                <span>W E L C O M E</span>
                <span>I T Z F I Z Z</span>
            </h1>

            <div class="stats">

                <div class="stat">
                    <h2>92%</h2>
                    <p>Customer satisfaction</p>
                </div>

                <div class="stat">
                    <h2>85%</h2>
                    <p>Better performance</p>
                </div>

                <div class="stat">
                    <h2>78%</h2>
                    <p>More engagement</p>
                </div>

            </div>

        </div>

        <div class="visual">

            <div class="visual-glow"></div>

            <div class="visual-object">

                <div class="visual-ring ring-one"></div>
                <div class="visual-ring ring-two"></div>

                <div class="product">

                    <div class="product-top"></div>

                    <div class="product-body">

                        <div class="product-label">
                            <span>FIZZ</span>
                            <small>ORIGINAL EXPERIENCE</small>
                        </div>

                    </div>

                    <div class="product-bottom"></div>

                </div>

            </div>

        </div>

        <div class="scroll-indicator">

            <span></span>

            <p>SCROLL TO EXPLORE</p>

        </div>

    </main>


    <section class="scroll-section">

        <div class="section-content">

            <p>THE EXPERIENCE CONTINUES</p>

            <h2>Built for movement.</h2>

        </div>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script src="script.js"></script>

</body>
</html>s
